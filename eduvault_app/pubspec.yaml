name: eduvault_app
description: "Platform e-book akademik berlisensi berbasis AI"


version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Icons
  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.4.0

  file_picker: ^8.0.0
  
  # State Management
  flutter_riverpod: ^2.4.0

  # Secure Storage (simpan token login)
  flutter_secure_storage: ^9.0.0

  # PDF Viewer
  flutter_pdfview: ^1.3.2

  # Cached Image
  cached_network_image: ^3.3.1

  # URL Launcher
  url_launcher: ^6.2.2

  # WebView untuk Midtrans Snap
  webview_flutter: ^4.4.2


  # App deeplink
  app_links: ^6.1.1

  # Shimmer loading
  shimmer: ^3.0.0

  fluttertoast: ^8.2.4

  # path_provider (untuk simpan PDF sementara)
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/